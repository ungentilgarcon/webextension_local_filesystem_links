name: Build and draft release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            addon_version: ${{ steps.versions.outputs.addon_version }}
            host_version: ${{ steps.versions.outputs.host_version }}
        steps:
            - uses: actions/checkout@v4
            - id: versions
              name: Validate tag and component versions
              shell: bash
              run: |
                  addon_version="$(node -p "require('./package.json').version")"
                  host_version="$(node -p "require('./native-host/package.json').version")"
                  expected_tag="v${host_version}"
                  if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
                    echo "::error::Tag $GITHUB_REF_NAME must match native-host/package.json version ($expected_tag)."
                    exit 1
                  fi
                  echo "addon_version=$addon_version" >> "$GITHUB_OUTPUT"
                  echo "host_version=$host_version" >> "$GITHUB_OUTPUT"

    firefox:
        needs: validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npx web-ext lint --source-dir ./dist
            - name: Download published Firefox add-on from AMO
              env:
                  ADDON_VERSION: ${{ needs.validate.outputs.addon_version }}
              run: |
                  listing="$(curl --fail --silent --show-error \
                    https://addons.mozilla.org/api/v5/addons/addon/local-filesystem-links-reboot/)"
                  published_version="$(jq -r '.current_version.version // empty' <<< "$listing")"
                  file_status="$(jq -r '.current_version.file.status // empty' <<< "$listing")"
                  if [[ "$published_version" != "$ADDON_VERSION" || "$file_status" != "public" ]]; then
                    echo "::error::AMO must publish add-on version $ADDON_VERSION before creating this release (found $published_version, status $file_status)."
                    exit 1
                  fi
                  signed_addon_url="$(jq -r '.current_version.file.url' <<< "$listing")"
                  expected_hash="$(jq -r '.current_version.file.hash | sub("^sha256:"; "")' <<< "$listing")"
                  mkdir -p web-ext-artifacts
                  signed_addon="web-ext-artifacts/local_filesystem_links-${ADDON_VERSION}.xpi"
                  curl --fail --location --silent --show-error "$signed_addon_url" --output "$signed_addon"
                  echo "$expected_hash  $signed_addon" | sha256sum --check --status
                  python3 - "$signed_addon" "$ADDON_VERSION" <<'PY'
                  import json
                  import sys
                  import zipfile

                  package, expected_version = sys.argv[1:]
                  with zipfile.ZipFile(package) as xpi:
                      manifest = json.loads(xpi.read("manifest.json"))
                      addon_id = manifest["browser_specific_settings"]["gecko"]["id"]
                      if manifest["version"] != expected_version:
                          raise SystemExit(f"Unexpected Firefox add-on version: {manifest['version']}")
                      if addon_id != "{b0875df6-5b25-4907-a2c1-10ca04249fb8}":
                          raise SystemExit(f"Unexpected Firefox add-on ID: {addon_id}")
                      if not any(name.startswith("META-INF/") for name in xpi.namelist()):
                          raise SystemExit("AMO XPI is missing Mozilla signature metadata")
                  PY
            - name: Prepare Firefox release assets
              env:
                  ADDON_VERSION: ${{ needs.validate.outputs.addon_version }}
              run: |
                  mkdir -p release-assets
                  cp "web-ext-artifacts/local_filesystem_links-${ADDON_VERSION}.xpi" "release-assets/local_filesystem_links-${ADDON_VERSION}.xpi"
                  cp "web-ext-artifacts/local_filesystem_links-${ADDON_VERSION}.xpi" release-assets/firefox-addon.xpi
            - uses: actions/upload-artifact@v4
              with:
                  name: firefox-release-assets
                  path: release-assets/*
                  if-no-files-found: error
                  retention-days: 1

    windows:
        needs: validate
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.15'
                  architecture: x64
            - name: Install native-host dependencies
              shell: pwsh
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r native-host/requirements.txt
            - name: Test native host
              shell: pwsh
              run: python -m unittest discover -s native-host/tests -v
            - name: Build Windows native host
              shell: bash
              run: |
                  cd native-host
                  bash build/build.sh
            - name: Install Inno Setup
              shell: pwsh
              run: choco install innosetup --yes --no-progress
            - name: Build Windows installer
              shell: pwsh
              env:
                  HOST_VERSION: ${{ needs.validate.outputs.host_version }}
              run: |
                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  if (-not (Test-Path $iscc)) {
                    throw "Inno Setup compiler not found at $iscc"
                  }
                  & $iscc "native-host\build\windows\InnoSetupScript.iss"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Inno Setup failed with exit code $LASTEXITCODE"
                  }
                  $source = "native-host\bin\win32\native-app-setup.exe"
                  if (-not (Test-Path $source)) {
                    throw "Installer was not created at $source"
                  }
                  New-Item -ItemType Directory -Force -Path release-assets | Out-Null
                  Copy-Item $source "release-assets\native-app-setup.exe"
                  Copy-Item $source "release-assets\native-app-setup-$env:HOST_VERSION.exe"
            - uses: actions/upload-artifact@v4
              with:
                  name: windows-release-assets
                  path: release-assets/*
                  if-no-files-found: error
                  retention-days: 1

    linux:
        needs: validate
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.15'
                  architecture: x64
            - name: Install native-host dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r native-host/requirements.txt
            - name: Test native host
              run: python -m unittest discover -s native-host/tests -v
            - name: Build Linux native host and Debian package
              env:
                  HOST_VERSION: ${{ needs.validate.outputs.host_version }}
              run: |
                  (cd native-host && bash build/build.sh)
                  bash native-host/build/linux/package-deb.sh "$HOST_VERSION" release-assets
            - uses: actions/upload-artifact@v4
              with:
                  name: linux-release-assets
                  path: release-assets/*
                  if-no-files-found: error
                  retention-days: 1

    draft-release:
        needs: [validate, firefox, windows, linux]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: firefox-release-assets
                  path: release-assets
            - uses: actions/download-artifact@v4
              with:
                  name: windows-release-assets
                  path: release-assets
            - uses: actions/download-artifact@v4
              with:
                  name: linux-release-assets
                  path: release-assets
            - name: Write release notes
              env:
                  ADDON_VERSION: ${{ needs.validate.outputs.addon_version }}
                  HOST_VERSION: ${{ needs.validate.outputs.host_version }}
              run: |
                  cat > release-notes.md <<EOF
                  ## Components

                  - Firefox add-on: \`$ADDON_VERSION\` (published on Firefox Add-ons)
                  - Windows native host: \`$HOST_VERSION\`
                  - Linux native host: \`$HOST_VERSION\` (Debian 12+/Ubuntu 22.04+ amd64 package; Firefox only)

                  Install both the Firefox add-on and the native host, then restart Firefox.
                  Windows users can optionally enable diagnostic logging during installation.
                  The Linux package is for Debian 12+/Ubuntu 22.04+ amd64 systems with a
                  system-installed Firefox. Snap/Flatpak Firefox installations may not be able to access it.
                  Chrome is not supported.

                  If this project is useful to you, you can optionally support its
                  maintenance with a [PayPal donation](https://paypal.me/ungentilgarcon).
                  Donations are voluntary and are not required to use the add-on.

                  ## Assets

                  - \`firefox-addon.xpi\` is the current publicly listed Firefox add-on.
                  - \`native-app-setup.exe\` is the current Windows installer.
                  - \`local-filesystem-links-native-host.deb\` is the Linux Firefox native host.
                  - Versioned copies are provided for each component.
                  EOF
            - uses: softprops/action-gh-release@v2
              with:
                  name: Local Filesystem Links ${{ github.ref_name }}
                  draft: true
                  prerelease: false
                  body_path: release-notes.md
                  files: release-assets/*
                  fail_on_unmatched_files: true
